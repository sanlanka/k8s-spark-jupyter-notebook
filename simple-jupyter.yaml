apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter-simple
  namespace: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyter-simple
  template:
    metadata:
      labels:
        app: jupyter-simple
    spec:
      containers:
      - name: jupyter
        image: jupyter/pyspark-notebook:latest
        ports:
        - containerPort: 8888
        - containerPort: 4040
        env:
        - name: JUPYTER_ENABLE_LAB
          value: "yes"
        - name: JUPYTER_TOKEN
          value: "spark123"
        # Use local Spark mode initially
        - name: SPARK_MASTER
          value: "local[*]"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
        volumeMounts:
        - name: jupyter-data
          mountPath: /home/jovyan/work
      volumes:
      - name: jupyter-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jupyter-simple-service
  namespace: api
spec:
  type: LoadBalancer
  ports:
  - name: jupyter
    port: 8888
    targetPort: 8888
  - name: spark-ui
    port: 4040
    targetPort: 4040
  selector:
    app: jupyter-simple 