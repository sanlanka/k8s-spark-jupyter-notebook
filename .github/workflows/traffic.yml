name: Traffic stats

on:
  schedule:
    - cron: "17 3 * * *"   # daily at 03:17 UTC
  workflow_dispatch:         # run on demand from the Actions tab

permissions:
  contents: write            # built-in token commits the CSVs

concurrency:
  group: traffic-stats
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mint a short-lived (1h) installation token scoped to Administration:read.
      # No PAT — just the App's ID (a repo variable) and private key (a secret).
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: "4387378"   # App ID is not secret; only the private key is
          private-key: ${{ secrets.PAGE_VIEWER_COUNTER_GITHUB_ACCESS_KEY }}
          permission-administration: read

      - name: Snapshot traffic
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 .github/scripts/traffic.py

      - name: Commit updated stats
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats/
          if git diff --cached --quiet; then
            echo "No stats changes."
          else
            git commit -m "chore: update traffic stats [skip ci]"
            git push
          fi
