apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: spark-jupyter

# Skaffold builds ONE image (Spark + Python + Delta + JupyterLab) used by every
# pod. On Docker Desktop / minikube the image is used straight from the local
# daemon (no registry push needed).
#
# Versions and extra packages come from `versions:` / `extraPackages:` in
# charts/spark/values.yaml (+ your -f file) — spinup.sh reads them and exports
# these env vars. Don't hardcode them here.
build:
  local:
    push: false
  artifacts:
    - image: spark-jupyter
      context: docker/spark
      docker:
        dockerfile: Dockerfile
        buildArgs:
          SPARK_VERSION: "{{.SPARK_VERSION}}"
          PYTHON_VERSION: "{{.PYTHON_VERSION}}"
          DELTA_SPARK_VERSION: "{{.DELTA_SPARK_VERSION}}"
          JAVA_VERSION: "{{.JAVA_VERSION}}"
          EXTRA_MAVEN_PACKAGES: "{{.EXTRA_MAVEN_PACKAGES}}"
          EXTRA_PIP_PACKAGES: "{{.EXTRA_PIP_PACKAGES}}"

# Deploy the custom Helm chart, injecting the freshly built image tag.
manifests:
  helm:
    releases:
      - name: spark-jupyter
        chartPath: charts/spark
        namespace: api
        createNamespace: true
        # Chart defaults, then the project's own file from `spinup.sh -f` (later
        # files win). spinup.sh sets PROJECT_VALUES to the defaults when no -f.
        valuesFiles:
          - charts/spark/values.yaml
          - "{{.PROJECT_VALUES}}"
        setValueTemplates:
          image: "{{.IMAGE_REPO_spark_jupyter}}:{{.IMAGE_TAG_spark_jupyter}}"
          # Host dir to mount into Jupyter + workers. Set PROJECT_DIR (spinup.sh
          # does); if empty the chart skips the mount.
          hostMount.hostPath: "{{.PROJECT_DIR}}"
deploy:
  helm: {}

# Port-forwarding is part of the Skaffold config — `skaffold run --port-forward`
# (or `skaffold dev`) forwards these automatically. No manual kubectl needed.
portForward:
  - resourceType: service
    resourceName: jupyter-service
    namespace: api
    port: 8888
    localPort: 8888
  - resourceType: service
    resourceName: jupyter-service
    namespace: api
    port: 4040
    localPort: 4040
  - resourceType: service
    resourceName: spark-master
    namespace: api
    port: 8080
    localPort: 8080
  # Spark Connect: lets any local program use the cluster via sc://localhost:15002.
  - resourceType: service
    resourceName: spark-connect
    namespace: api
    port: 15002
    localPort: 15002
  # Spark Connect driver UI (4040 is taken by the Jupyter driver UI).
  - resourceType: service
    resourceName: spark-connect
    namespace: api
    port: 4040
    localPort: 4041
