# Values for the spark-jupyter chart.

spark:
  # Cluster runs the stock, official Apache Spark image (Docker Hub) — no build.
  image: apache/spark:4.0.0
  masterService: spark-master
  worker:
    replicas: 1        # start with 2 pods total: 1 master + 1 worker
    cores: 1
    memory: 2G         # headroom so a default 1g PySpark executor fits
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

jupyter:
  # Built by Skaffold from docker/jupyter/Dockerfile (apache/spark + JupyterLab).
  # Skaffold overrides this at deploy time; the default lets `helm template` work.
  image: spark-jupyter:latest
  token: spark123

# Mount a host directory into the Jupyter driver AND the workers at the SAME
# path, so local files (notebooks/, test-datasets/) are readable in both local
# and cluster mode — in cluster mode the executors read the file too, so the
# path must resolve identically on every pod. Docker Desktop / minikube share
# /Users. spinup.sh injects hostPath = the repo dir automatically.
hostMount:
  enabled: true
  hostPath: ""                           # set by Skaffold/spinup.sh (repo dir)
  # Mount the repo AS Jupyter's root, so notebooks/ and test-datasets/ sit at
  # the top level and you can use short relative paths (e.g. from a notebook in
  # notebooks/: "../test-datasets/retail_sales.csv"). Same path on the workers
  # so cluster-mode reads resolve identically.
  mountPath: /opt/spark/work-dir
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
