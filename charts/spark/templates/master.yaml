apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  labels:
    app: spark-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      # Stop k8s injecting SPARK_MASTER_PORT=tcp://... service-link vars, which
      # collide with Spark's own SPARK_MASTER_PORT and crash the master.
      enableServiceLinks: false
      containers:
        - name: spark-master
          image: {{ .Values.spark.image | quote }}
          command: ["/opt/spark/bin/spark-class"]
          args: ["org.apache.spark.deploy.master.Master"]
          env:
            # Bind/advertise on the pod IP so workers and drivers can reach it.
            - name: SPARK_LOCAL_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: cluster
              containerPort: 7077
            - name: master-ui
              containerPort: 8080
          resources:
{{ toYaml .Values.spark.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.spark.masterService }}
  labels:
    app: spark-master
spec:
  selector:
    app: spark-master
  ports:
    - name: cluster
      port: 7077
      targetPort: 7077
    - name: master-ui
      port: 8080
      targetPort: 8080
