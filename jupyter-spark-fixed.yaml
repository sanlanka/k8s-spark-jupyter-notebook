apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter-pyspark
  namespace: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyter-pyspark
  template:
    metadata:
      labels:
        app: jupyter-pyspark
    spec:
      containers:
      - name: jupyter
        image: jupyter/pyspark-notebook:latest
        ports:
        - containerPort: 8888
        - containerPort: 4040
        - containerPort: 7077
        env:
        - name: JUPYTER_ENABLE_LAB
          value: "yes"
        - name: JUPYTER_TOKEN
          value: "spark123"
        - name: SPARK_MASTER
          value: "spark://spark-cluster-master-svc:7077"
        # Fix networking issues
        - name: SPARK_LOCAL_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: SPARK_DRIVER_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        volumeMounts:
        - name: jupyter-data
          mountPath: /home/jovyan/work
      volumes:
      - name: jupyter-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jupyter-service
  namespace: api
spec:
  type: LoadBalancer
  ports:
  - name: jupyter
    port: 8888
    targetPort: 8888
  - name: spark-ui
    port: 4040
    targetPort: 4040
  selector:
    app: jupyter-pyspark
---
# Headless service for pod-to-pod communication
apiVersion: v1
kind: Service
metadata:
  name: jupyter-headless
  namespace: api
spec:
  clusterIP: None
  ports:
  - name: jupyter
    port: 8888
    targetPort: 8888
  - name: spark-ui
    port: 4040
    targetPort: 4040
  selector:
    app: jupyter-pyspark 